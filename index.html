<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>実験素材</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #0f1419;
    }


    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }


    /* 上部説明 */
    .instruction {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.7;
    }


    /* X風投稿 */
    .post {
      width: 100%;
      border: 1px solid #cfd9de;
      border-radius: 16px;
      padding: 16px;
      background: white;
    }


    /* 投稿者情報 */
    .user-area {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }


    /* アイコン */
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d9d9d9;
      margin-right: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;

      flex-shrink: 0;
    }


    /* 名前 */
    .user-info {
      min-width: 0;
    }


    .name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }


    .handle {
      font-size: 15px;
      color: #536471;
      margin-top: 2px;
    }


    /* 投稿本文 */
    .post-text {
      font-size: 17px;
      line-height: 1.65;
      white-space: pre-line;
      margin-bottom: 14px;
    }


    /* 動画 */
    .video-area {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #cfd9de;
      background: #000;
    }


    video {
      display: block;
      width: 100%;
      height: auto;
    }


    /* X風の下部アイコン */
    .actions {
      display: flex;
      justify-content: space-around;
      color: #536471;
      padding-top: 14px;
      font-size: 18px;
    }


    /* 視聴案内 */
    #message {
      text-align: center;
      margin-top: 24px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
    }


    /* アンケートに戻る */
    #returnButton {
      display: none;

      width: 100%;
      margin-top: 20px;

      padding: 15px 20px;

      border: none;
      border-radius: 9999px;

      background: #0f1419;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }


    #returnButton:hover {
      opacity: 0.85;
    }


    /* スマホ */
    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .post {
        padding: 14px;
      }

      .post-text {
        font-size: 16px;
      }

      .instruction {
        font-size: 15px;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <!-- ここは実験参加者への説明 -->
    <div class="instruction">
      以下の投稿をご覧ください。<br>
      投稿内の動画を最後まで視聴してください。
    </div>



    <!-- X風投稿 -->
    <div class="post">


      <!-- 投稿者 -->
      <div class="user-area">

        <div class="avatar">
          A
        </div>

        <div class="user-info">

          <!-- ★ここを架空アニメーター名に変更 -->
          <div class="name">
            朝霧レン
          </div>

          <!-- ★ここを架空IDに変更 -->
          <div class="handle">
            @ren_animation
          </div>

        </div>

      </div>



      <!-- ★ここが条件ごとに変える投稿文 -->
      <div class="post-text">
新作アニメーション「〇〇」に原画として参加しました。
担当したカットの一部です。
      </div>



      <!-- 動画 -->
      <div class="video-area">

        <video
          id="stimulus"
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="stimulus.mp4"
            type="video/mp4"
          >

          お使いのブラウザでは動画を再生できません。

        </video>

      </div>



      <!-- X風アイコン -->
      <div class="actions">
        <span>♡</span>
        <span>↻</span>
        <span>↗</span>
      </div>


    </div>



    <!-- 視聴状態 -->
    <p id="message">
      動画を最後まで視聴してください。
    </p>



    <!-- 動画終了後のみ表示 -->
    <button
      id="returnButton"
      onclick="history.back()"
    >
      アンケートに戻る
    </button>


  </div>



  <script>

    const video =
      document.getElementById("stimulus");

    const button =
      document.getElementById("returnButton");

    const message =
      document.getElementById("message");


    video.addEventListener(
      "ended",
      function() {

        message.textContent =
          "動画の視聴が終了しました。アンケートに戻って回答を続けてください。";

        button.style.display =
          "block";

      }
    );

  </script>


</body>
</html>

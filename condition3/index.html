<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>実験素材</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    video {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;

      /* PCでも中央に配置 */
      margin: 0 auto;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 15px;
    }

    #returnButton {
      display: none;

      margin: 25px auto 0;
      padding: 14px 28px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    /*
      PC・大型端末だけに適用。
      スマホの動画サイズには影響しない。
    */
    @media (min-width: 768px) {

      body {
        margin-top: 20px;
        margin-bottom: 20px;
      }

      video {
        width: auto;
        max-width: 100%;
        max-height: 72vh;
      }
    }

  </style>
</head>

<body>

  <h2>投稿全体をご覧ください。</h2>

  <video
    id="stimulus"
    controls
    playsinline
  >
    <source src="stimulus.mp4" type="video/mp4">

    お使いのブラウザでは動画を再生できません。
  </video>

  <p id="message">
    再生ボタンを押せば何度でもご覧いただけます。
  </p>

  <button
    id="returnButton"
    onclick="history.back()"
  >
    アンケートに戻る
  </button>

  <script>

    const video =
      document.getElementById("stimulus");

    const button =
      document.getElementById("returnButton");

    const message =
      document.getElementById("message");


    video.addEventListener("ended", function() {

      message.textContent =
        "投稿の閲覧が終了しました。再度ご覧いただくこともできます。";

      button.style.display =
        "block";

    });

  </script>

</body>
</html>
